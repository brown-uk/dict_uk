import org.apache.tools.ant.filters.ReplaceTokens

version=new File("${projectDir}/../../VERSION").text.trim()
def hunspellDir="${projectDir}/../hunspell/build/hunspell"

println "Version: $version"

def subname = ""

if( project.hasProperty("type") ) {
    if( project.getProperty("type") == "full" ) subname = "full"
    else if( project.getProperty("type") == "nolat" ) subname = "nolat"

    logger.lifecycle("Building type: ${subname}")
}

task prepareFiles {

  doLast() {
    copy {
        from "$hunspellDir/$subname/uk_UA.aff"
        from "$hunspellDir/$subname/uk_UA.dic"
        from "thesaurus"
        from "hyphen"
        from "spell"
        into "build/oxt/uk_UA"
    }

    copy {
	    from "meta-oxt/META-INF"
	    into "build/oxt/META-INF"
	}
	
    copy {
	    from "../LICENSE"
	    from "meta-oxt/dictionaries.xcu"
	    from "meta-oxt/downloadplaces.txt"
	    from "meta-oxt/icon64.png"
	    from("meta-oxt/description.xml") {
            filter(ReplaceTokens, tokens: [VERSION: project.version])
        }
	    into "build/oxt"
    }

    ['sh', '-c', "bin/th_gen_idx.pl < thesaurus/th_uk_UA.dat > build/oxt/uk_UA/th_uk_UA.idx"].join(' ').execute()
  }
}

task oxt (type: Zip, dependsOn: prepareFiles) {
    def infix = subname ? "_${subname}" : ""
    from 'build/oxt'
    archiveBaseName = "dict-uk_UA$infix-${project.version}"
    archiveExtension = "oxt"
    destinationDirectory = file("build")
    
    outputs.files "$archiveBaseName.$archiveExtension"
}


